name: agentfluency

services:
  postgres:
    image: postgres:18
    container_name: agentfluency-postgres
    environment:
      POSTGRES_DB: agentfluency
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agentfluency_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID must not be empty}"
        : "$${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY must not be empty}"
        exec /entrypoint.sh mini -dir=/data
    env_file:
      - .env.example
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - agentfluency_seaweedfs_data:/data
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  agentfluency_postgres_data:
  agentfluency_seaweedfs_data:
